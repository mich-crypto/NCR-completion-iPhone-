<body>
  <header class="topbar">
    <h1>NCR Completion Email</h1>
  </header>

  <main>
    <div id="banner" class="banner hidden" role="status"></div>

    <form id="ncrForm" class="card">
      <div class="card-body">
        <label>NCR Number
          <input id="ncrNumber" type="text" inputmode="text" required placeholder="e.g. NCR-2026-014" />
        </label>
        <label>NCR Title
          <input id="ncrTitle" type="text" required placeholder="Short description of the NCR" />
        </label>
        <label>Status
          <select id="status" required>
            <option value="Completed">Completed</option>
            <option value="Updated">Updated</option>
          </select>
        </label>
        <label>Work Performed
          <textarea id="workPerformed" rows="6" required placeholder="Describe the work performed to close/update this NCR"></textarea>
        </label>

        <label>Photos <span class="hint-inline">(reminder list only — Outlook can't be pre-filled with attachments, so add these yourself once it opens)</span>
          <input id="photoInput" type="file" accept="image/*" multiple capture="environment" />
        </label>
        <div id="photoGrid" class="photo-grid"></div>

        <label>Recipients
          <div class="chip-input" id="chipInput">
            <input id="recipientEntry" type="email" inputmode="email" placeholder="Add an email and press Enter" autocapitalize="off" autocorrect="off" spellcheck="false" />
          </div>
        </label>
        <label class="checkbox-row">
          <input id="rememberRecipients" type="checkbox" checked />
          Remember this recipient list as the default for next time
        </label>

        <label>Subject
          <input id="subject" type="text" placeholder="Auto-generated from the fields above (editable)" />
        </label>

        <div class="button-row">
          <button id="previewBtn" class="btn btn-ghost" type="button">Preview</button>
          <button id="newBtn" class="btn btn-ghost" type="button">New NCR</button>
        </div>
        <div class="button-row">
          <button id="openOutlookBtn" class="btn btn-primary" type="button">Open in Outlook</button>
        </div>
        <a id="openMailFallback" class="fallback-link" href="#">Outlook didn't open? Try your default Mail app instead</a>
      </div>
    </form>

    <section id="previewSection" class="card hidden">
      <div class="card-body">
        <h2>Preview</h2>
        <p class="hint">This is the plain-text draft Outlook will open with — Outlook's compose screen doesn't accept a formatted table via a link, only text. Attach the photos below once it opens.</p>
        <div id="previewTo" class="preview-meta"></div>
        <div id="previewSubject" class="preview-meta"></div>
        <pre id="previewBody" class="preview-body"></pre>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/mailto.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
